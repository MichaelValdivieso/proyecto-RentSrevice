<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Dinámica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            cursor: pointer;
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h2>Tabla de Propiedades</h2>
    <label>Filtrar por Ciudad: <input type="text" id="filterCity" onkeyup="filterTable()"></label>
    <label>Rango de Precio: <input type="number" id="minPrice" placeholder="Mín" onkeyup="filterTable()"> -
        <input type="number" id="maxPrice" placeholder="Máx" onkeyup="filterTable()"></label>
    <label>Rango de Tamaño: <input type="number" id="minSize" placeholder="Mín" onkeyup="filterTable()"> -
        <input type="number" id="maxSize" placeholder="Máx" onkeyup="filterTable()"></label>

    <table id="propertyTable">
        <thead>
            <tr>
                <th onclick="sortTable('city')">Ciudad</th>
                <th>Calle</th>
                <th>Número</th>
                <th onclick="sortTable('size')">Tamaño Área</th>
                <th>AC</th>
                <th>Año</th>
                <th onclick="sortTable('price')">Precio Renta</th>
                <th>Fecha</th>
                <th>Favorito</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <h2>Favoritos</h2>
    <table id="favoritesTable">
        <thead>
            <tr>
                <th>Ciudad</th>
                <th>Calle</th>
                <th>Número</th>
                <th>Tamaño Área</th>
                <th>Precio Renta</th>
                <th>Favorito</th>
            </tr>
        </thead>
        <tbody id="favoritesBody"></tbody>
    </table>

    <script>
        let properties = [
            { city: "Quito", street: "Av. Amazonas", number: 10, size: 80, ac: true, year: 2015, price: 1200, date: "2024-01-10", favorite: false },
            { city: "Loja", street: "Av. Universitaria", number: 22, size: 100, ac: true, year: 2018, price: 1500, date: "2024-02-15", favorite: false },
            { city: "Guayaquil", street: "Av. Barcelona", number: 5, size: 60, ac: false, year: 2010, price: 900, date: "2024-03-01", favorite: false }
        ];

        function filterTable() {
            let cityFilter = document.getElementById('filterCity').value.toLowerCase();
            let minPrice = document.getElementById('minPrice').value;
            let maxPrice = document.getElementById('maxPrice').value;
            let minSize = document.getElementById('minSize').value;
            let maxSize = document.getElementById('maxSize').value;

            let filteredProperties = properties.filter(prop => {
                return (cityFilter === '' || prop.city.toLowerCase().includes(cityFilter)) &&
                    (minPrice === '' || prop.price >= parseInt(minPrice)) &&
                    (maxPrice === '' || prop.price <= parseInt(maxPrice)) &&
                    (minSize === '' || prop.size >= parseInt(minSize)) &&
                    (maxSize === '' || prop.size <= parseInt(maxSize));
            });

            loadTable(filteredProperties);
        }

        function loadTable(data = properties) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            data.forEach((prop, index) => {
                let icon = prop.favorite ? '❤️' : '🤍';
                let row = `<tr>
                    <td>${prop.city}</td>
                    <td>${prop.street}</td>
                    <td>${prop.number}</td>
                    <td>${prop.size}</td>
                    <td>${prop.ac}</td>
                    <td>${prop.year}</td>
                    <td>${prop.price}</td>
                    <td>${prop.date}</td>
                    <td><button onclick="toggleFavorite(${index})">${icon}</button></td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

        function toggleFavorite(index) {
            properties[index].favorite = !properties[index].favorite;
            loadTable();
            loadFavorites();
        }

        function loadFavorites() {
            const favoritesBody = document.getElementById('favoritesBody');
            favoritesBody.innerHTML = '';
            properties.forEach((prop) => {
                if (prop.favorite) {
                    let row = `<tr>
                        <td>${prop.city}</td>
                        <td>${prop.street}</td>
                        <td>${prop.number}</td>
                        <td>${prop.size}</td>
                        <td>${prop.price}</td>
                        <td><button onclick="toggleFavorite(${properties.indexOf(prop)})">❤️</button></td>
                    </tr>`;
                    favoritesBody.innerHTML += row;
                }
            });
        }

        function sortTable(property) {
            properties.sort((a, b) => (a[property] > b[property]) ? 1 : -1);
            loadTable();
        }

        loadTable();
    </script>
</body>

</html>
