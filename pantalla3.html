<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body>
    <div class="encabezado">
        <div class="logo"><img class="imgLogo" src="./proyectRentService/Img/Logo.jpg
            " alt=""></div>
        <div class="opciones">
          <div class="saludo "> 
            <div class="userIcon"><img class="imgUser" src="./Img/user.png" alt=""></div>
            <div class="userHello">Hello</div>
            <div class="userName">xxxxxxxxxxx</div>
          </div>
          <div class="menu ">

     <div class="formDiv">

        </div> 

    <div class="formulario">

            <div class="text">City</div>
                <div><input class="textArea" type="text" name="" id=""></div>
        </div>

        <div class="formDiv">
            <div class="text">Price Range</div>
            <select name="select">
            <option value="value1">0-500 usd</option>
            <option value="value2">501-1000 usd</option>

            <option value="value4">1501-2000 usd</option>

        </div>
        
        <div class="formDiv">
            <div class="text">Area Range</div>
            <select name="select"> 
            <option value="value1">0-150 mts2</option>
            <option value="value2">151-300 mts2</option>
            <option value="value3">301-450 mts2</option>
            <option value="value4">451-600 mts2</option>
            </select>
        </div>

        <div class="formDiv">
            <div class="text">Favorites</div>
                <div><input type="checkbox" id="cbox1" value="first_checkbox" /></label</div>
        </div>

        <div class="formDiv">
            <div class= "text"></div>
            <div><input type="button" value="New Flat" class="New Flat"></div>
        </div>
    </div>
</body>
