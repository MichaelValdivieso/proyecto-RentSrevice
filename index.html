<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href=".">
    <link rel="icon" type="image/svg+xml" href="./public/Logo.svg" />
    <link rel="stylesheet" href="./Css/styleIndex.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentService</title>
</head>

<body onload="checkSession()">
<div class="encabezado">
    <div class="logo"><img class="imgLogo" src="./Img/Logo.jpg" alt=""></div>
    <div class="opciones">
        <div class="saludo ">
            <!-- <div class="userIcon"><img class="imgUser" src="./Img/user.png" alt=""></div> -->
            <div class="userHello"></div>
            <div class="userName" id="userActivo"></div>
        </div>
        <div class="menu ">
            <div class="opMenu" id="home"></div>
            <div class="opMenu1"></div>
            <div class="opMenu"></div>
        </div>
    </div>
</div>
<div class="formulario">
    <div class="formTitulo">Login</div>
  
    <div class="formDiv" id="formDiv">
        <div class="text">Email:</div>
        <div><input class="textArea" type="text" name="" id="loginEmail"></div>
    </div>
    <div class="formDiv">
        <div class="text">Password:</div>
        <div><input class="textArea" type="password" name="" id="loginPassword"></div>
    </div>
   
    <div class="formDiv">
 

        <div class=" btnAceptar" id="btnIngreso"> Sign in 
          
        </div>
    </div>
    <div class="pie"> ¿No tienes cuenta? <a href="registro.html">Registrate</a> </div>
</div>



<div id="miModalOut" class="modal">
    <div class="modal-content">
        <p>✅ ¡Sesion cerrada!</p>
        <button class="ok" onclick="cerrarMensajeOut()">Cerrar</button>
    </div>
</div>
<div id="miModalNoInicio" class="modal">
    <div class="modal-content">
        <p>❌¡Email o contraseña incorrectos!</p>
        <button class="cerrar" onclick="cerrarMensajeNoInicio()">Cerrar</button>
    </div>
</div>

<div id="miModalTime" class="modal">
    <div class="modal-content">
        <p>❌¡Tiempo expirado cerrando sesion!</p>
        <button class="cerrar" onclick="cerrarMensajeTime()">Cerrar</button>
    </div>
</div>


<script src="./index.js"></script>
</body>

</html>
