<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href=".">
  <link rel="icon" type="image/svg+xml" href="./public/Logo.svg" />
  <link rel="stylesheet" href="./Css/register.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register RentEase</title>
</head>


<body>
  <!-- 
  // REGISTER -->
  <div class="encabezado">
    <div class="logo"><img class="imgLogo" src="./Img/Logo.jpg" alt=""></div>
  </div>

  <div class="formulario">
    <div class="formTitulo">Register</div>
    <div class="formDiv">
      <div class="text">Email:</div>
      <div><input class="textArea" type="email" name="" id="email" required></div>
    </div>
    <div class="formDiv">
      <div class="text">Password:</div>
      <div><input class="textArea" type="password" name="" id="password" minlength="6" required></div>
    </div>
    <div class="formDiv">
      <div class="text">Confirm Password:</div>
      <div><input class="textArea" type="password" name="" id="pass_confirm" minlength="6" required></div>
    </div>
    <div class="formDiv">
      <div class="text">First Name:</div>
      <div><input class="textArea" type="text" name="" id="firstName" required></div>
    </div>
    <div class="formDiv">
      <div class="text">Last Name:</div>
      <div><input class="textArea" type="text" name="" id="lastName" required></div>
    </div>
    <div class="formDiv">
      <div class="text">Birth Date:</div>
      <div><input class="textArea" type="date" name="" id="birthDate"></div>
    </div>
    <div class="formDiv">
      <div><button id="btnRegist" class="btnRegister">REGISTER</button></div>
      <div><button id="btnCancel" class="btnCancel">CANCEL</button></div>
    </div>
  </div>

  

  <!-- Caja modal 1 -  No cumple la edad permitida (18-120 años)  -->
  <!-- <button onclick="mostrarMensaje1()">Mostrar</button>  -->
  <div id="miModal1" class="modal">
    <div class="modal-content">
      <p>❌  No cumple la edad permitida (18-120 años)</p>
      <button class="cerrar" onclick="cerrarMensaje1()">Cerrar</button>
    </div>
  </div>

  <!-- Caja modal 2 - Usuario registrado -->
  <!-- <button onclick="mostrarMensaje2()">Mostrar</button> -->
  <div id="miModal2" class="modal">
    <div class="modal-content">
      <p>✅ Datos correctos, usuario registrado
       Realice su ingreso por la pantalla de LOGIN</p>
      <button class="cerrar" onclick="cerrarMensaje2()">Cerrar</button>
    </div>
  </div> 
  
  <!-- Caja modal 3 - Datos incompletos, digite nuevamente-->
  <!-- <button onclick="mostrarMensaje3()">Mostrar</button>  -->
  <div id="miModal3" class="modal">
    <div class="modal-content">
      <p>❌ Datos incompletos, digite nuevamente </p>
      <button class="cerrar" onclick="cerrarMensaje3()">Cerrar</button>
    </div>
  </div>

  <script type="module" src="./src/validar-register.js"></script>

</body>
</html>
